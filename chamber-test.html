<!DOCTYPE html>
<html>
<head>
  <meta name="robots" content="noindex, nofollow" />
  <title>Chamber Widget Test</title>
  <style>
    body { background: #1a1a1a; color: white; padding: 50px; }
    .test-section { margin: 50px 0; padding: 30px; border: 2px solid white; }
  </style>
</head>
<body>
  <h1>Chamber Widget Test Page</h1>

  <div class="test-section">
    <h2>Urbandale Chamber</h2>
    <div id="test-urbandale"></div>
    <script src="https://uniquelyurbandale.chambermaster.com/Content/Script/Member.js" type="text/javascript"></script>
    <script type="text/javascript">
      new MNI.Widgets.Member("test-urbandale",{member:10902,styleTemplate:"#@id{text-align:center;position:relative}#@id .mn-widget-member-name{font-weight:700}#@id .mn-widget-member-logo{max-width:200px}"}).create();
    </script>
  </div>

  <div class="test-section">
    <h2>Des Moines Westside Chamber - Test 1 (Your Code)</h2>
    <div id="test-westside-1"></div>
    <script src="https://desmoineswestsidechamber.chambermaster.com/Content/Script/Member.js" type="text/javascript"></script>
    <script type="text/javascript">
      new MNI.Widgets.Member("test-westside-1",{member:664,styleTemplate:"#@id{text-align:center;position:relative}#@id .mn-widget-member-name{font-weight:700}#@id .mn-widget-member-logo{max-width:200px}"}).create();
    </script>
  </div>

  <div class="test-section">
    <h2>Johnston Chamber (Static Image)</h2>
    <img src="assets/images/johnston-chamber-logo.png" alt="Johnston" style="width: 200px; display: block;" />
  </div>

  <div class="test-section">
    <h2>Check Browser Console</h2>
    <p>Open browser console (F12) and look for JavaScript errors</p>
  </div>
</body>
</html>
